<body>
  <main class="shell" id="app"><div class="skeleton">正在载入已验收数据…</div></main>
  <script>
    const fmt=(v,d=1)=>v===null||v===undefined?'暂无可用值':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
    const signed=(v,d=1,suffix='')=>v===null||v===undefined?'暂无':`${v>0?'+':''}${fmt(v,d)}${suffix}`;
    const cls=v=>v===null||v===undefined?'flat':v>0?'up':v<0?'down':'flat';
    const arrow=v=>v===null||v===undefined?'—':v>0?'↑':v<0?'↓':'→';
    const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const factorLabels={high_heat:'高温',high_temperature:'高温',root_zone_dryness:'根区干旱',harvest_rain:'收获期降雨',excess_rain:'过量降雨',establishment_excess_rain:'播种建苗期过量降雨',low_temperature:'低温',spring_wind:'春季风害',hot_dry_compound:'高温干旱复合',excess_rain_waterlogging:'过量降雨／渍涝',high_vpd:'高水汽压亏缺（VPD，空气干燥度）',low_solar:'低太阳辐射',low_solar_radiation:'低太阳辐射'};
    const rawMetricDisplayLabels={tmax_14d_mean:'Tmax日最高温度（14天移动平均）',tmin_14d_mean:'Tmin日最低温度（14天移动平均）',precip_14d_sum:'TP累计降水量（14天累计滚动值）',sw_rad_14d_mean:'SWd日短波辐射（14日移动平均）'};
    const centralVariableLabels={temperature_2m_max:'14日平均日最高温',temperature_2m_min:'14日平均日最低温',precipitation_sum:'TP累计降水量（14天累计滚动值）',shortwave_radiation_sum:'SW累计短波辐射（14天累计滚动值）',et0_fao_evapotranspiration:'14日累计参考蒸散',vapour_pressure_deficit_max:'14日平均最大水汽压亏缺（VPD）'};
    const centralDailyVariableLabels={temperature_2m_max:'日最高温',temperature_2m_min:'日最低温',precipitation_sum:'日降水',shortwave_radiation_sum:'日短波辐射',et0_fao_evapotranspiration:'日参考蒸散',vapour_pressure_deficit_max:'日最大水汽压亏缺（VPD）'};
    let DATA,selected='china',centralSelected='kazakhstan_turkistan';
    const subregionSelected={};
    const regionShortNames={china:'中国·新疆',us:'美国',brazil:'巴西',india:'印度',australia:'澳大利亚'};
    const networkStatusLabels={available:'可用',valid_era5_response:'可用',proxy_only:'单一代理区',inactive_or_gap:'当前未启用／缺口'};
    function regionCard(r){const points=`${r.valid_point_count??'—'} / ${r.target_point_count??'—'}`,isChina=r.id==='china',weight=isChina?'新疆18点代理；中国全国覆盖率不适用':`${fmt((r.official_production_weight_coverage||0)*100,2)}%`,active=r.id===selected;return `<article class="region-card ${active?'active':''}" aria-current="${active?'true':'false'}"><div class="card-head"><div><h3>${escapeHtml(r.name)}</h3><span class="asof">数据至 ${r.date}</span></div><span class="band ${r.band}">${r.band_display}胁迫</span></div><button type="button" class="score score-button chartable" data-chart-region="${r.id}" data-chart-metric="score" data-chart-title="${escapeHtml(r.name)} · 综合天气胁迫" aria-label="查看${escapeHtml(r.name)}综合分季节图">${fmt(r.score,2)} <small>/ 100</small></button><div class="meter"><i style="width:${Math.max(0,Math.min(100,r.score||0))}%"></i></div><div class="delta-row"><span>周环比 <b class="${cls(r.change_7d)}">${arrow(r.change_7d)} ${signed(r.change_7d,2)}</b></span><span>同比 <b class="${cls(r.change_yoy)}">${arrow(r.change_yoy)} ${signed(r.change_yoy,2)}</b></span></div><div class="coverage-line">当前有分/登记点 ${points} · 当前作季点位覆盖 ${fmt((r.point_coverage||0)*100,1)}%<br>${isChina?'监测范围':'天气监测覆盖产地范围比例'} ${weight}</div><div class="region-card-actions"><button type="button" class="region-detail-button" data-region="${r.id}" aria-pressed="${active?'true':'false'}">${active?'正在查看':'查看区域详情'}</button><button type="button" class="region-seasonal-button chartable" data-chart-region="${r.id}" data-chart-metric="score" data-chart-title="${escapeHtml(r.name)} · 综合天气胁迫">季节图 →</button></div></article>`}
    function subregionDetail(r,x){if(!x)return '<div class="watch-na">请选择一个地区查看具体因子。</div>';const bundle=(((DATA.subregion_seasonal||{})[r.id]||{})[x.id]||{}),seasonal=bundle.metrics||{},rawSeasonal=bundle.raw_metrics||{},raw=x.raw_weather||{},values=raw.values||{},chartAttrs=(id,title)=>`class="chartable" data-chart-region="${r.id}" data-chart-subregion="${escapeHtml(x.id)}" data-chart-metric="${id}" data-chart-title="${escapeHtml(x.name)} · ${escapeHtml(title)}"`,rawCards=['tmax_14d_mean','tmin_14d_mean','precip_14d_sum','sw_rad_14d_mean'].map(id=>{const label=rawMetricDisplayLabels[id]||id,hasChart=Boolean(rawSeasonal[id]),value=values[id]===null||values[id]===undefined?'暂无可用值':fmt(values[id],3)+' '+escapeHtml(values[id+'_unit']||'');return `<div class="subregion-raw-item"><span>${escapeHtml(label)}</span><b ${hasChart?chartAttrs(id,label):''}>${value}</b></div>`}).join('');const factorEntries=Object.entries(x.factor_scores||{}),factorCards=factorEntries.map(([id,value])=>{const label=factorLabels[id]||id,hasChart=Boolean(seasonal[id]),diagnostic=(x.factor_diagnostics||{})[id]||{},reason=diagnostic.reason||'未提供具体状态原因';if(value===null||value===undefined)return `<div class="subregion-factor"><span>${escapeHtml(label)}</span><span class="na">${escapeHtml(reason)}</span><b class="na">—</b></div>`;if(Math.abs(Number(value))<1e-12)return `<div class="subregion-factor"><span>${escapeHtml(label)}</span><span class="factor-zero-reason">${escapeHtml(reason)}</span><b ${hasChart?chartAttrs(id,label):''}>${fmt(value,2)}</b></div>`;return `<div class="subregion-factor"><span>${escapeHtml(label)}</span><span class="subregion-factor-track" title="${escapeHtml(reason)}"><i style="width:${Math.max(0,Math.min(100,value))}%"></i></span><b ${hasChart?chartAttrs(id,label):''}>${fmt(value,2)}</b></div>`}).join('')||'<div class="watch-na">该地区层级暂未产出单因子。</div>';const pointText=(x.point_names||[]).join('、')||'未单独列出',scoreChart=Boolean(seasonal.score),score=x.score===null||x.score===undefined?'暂无综合分':fmt(x.score,2)+' / 100',scoreReason=x.score_diagnostic?.reason||'';return `<div class="subregion-detail" id="selectedSubregionDetail"><div class="subregion-detail-head"><div><span class="region-detail-kicker">当前所选地区</span><h4>${escapeHtml(x.name||'')}</h4><p>阶段：${escapeHtml(x.stage_proxy||'暂无')} · 日期：${escapeHtml(raw.date||r.date||'暂无')}</p><p class="subregion-score-reason">${escapeHtml(scoreReason)}</p></div><strong ${scoreChart?chartAttrs('score','综合天气胁迫'):''}>${score}</strong></div><div class="subregion-detail-grid"><section class="subregion-metrics"><h5>天气因子原始数据</h5><div class="subregion-raw-grid">${rawCards}</div><p class="subregion-note">有效点 ${raw.valid_point_count??'—'} / ${raw.target_point_count??'—'}；${escapeHtml(x.coverage_semantics||'')}</p></section><section class="subregion-metrics"><h5>模型天气胁迫单因子评分</h5><div class="subregion-factor-list">${factorCards}</div><p class="subregion-note">“未启用”表示当地当前阶段权重为0；“源修订”表示为避免混用新旧快照而主动留空；0.00 是已计算且未落入历史不利尾部。</p></section></div><p class="subregion-note">监测点：${escapeHtml(pointText)}</p></div>`}
    function regionNetwork(r){const rows=r.network_details||[],seasonalBySub=(DATA.subregion_seasonal||{})[r.id]||{};if(!subregionSelected[r.id]||!rows.some(x=>String(x.id)===String(subregionSelected[r.id])))subregionSelected[r.id]=rows[0]?.id;const chosen=rows.find(x=>String(x.id)===String(subregionSelected[r.id]))||rows[0];const cards=rows.map(x=>{const hasPoints=x.valid_point_count!==null&&x.valid_point_count!==undefined&&x.target_point_count!==null&&x.target_point_count!==undefined,score=x.score===null||x.score===undefined?'暂无可用值':`${fmt(x.score,2)} / 100`,hasChart=Boolean(seasonalBySub[x.id]?.metrics?.score),weight=x.production_weight_share===null||x.production_weight_share===undefined?'权重未提供':x.weight_type==='official_cotton_area_proxy'?`官方面积代理权重 ${fmt(x.production_weight_share*100,2)}%`:`登记网络产量权重 ${fmt(x.production_weight_share*100,2)}%`,active=chosen&&String(chosen.id)===String(x.id);return `<button type="button" class="subregion-card ${active?'active':''} ${x.score===null||x.score===undefined?'is-gap':''}" data-subregion-id="${escapeHtml(x.id||x.name||'')}" aria-pressed="${active?'true':'false'}"><div class="subregion-card-head"><h4>${escapeHtml(x.name||'')}</h4><span>${escapeHtml(networkStatusLabels[x.status]||x.status||'状态未提供')}</span></div><b ${hasChart?`class="chartable" data-chart-region="${r.id}" data-chart-subregion="${escapeHtml(x.id)}" data-chart-metric="score" data-chart-title="${escapeHtml(x.name)} · 综合天气胁迫"`:''}>${score}</b><div class="subregion-meter"><i style="width:${Math.max(0,Math.min(100,x.score||0))}%"></i></div><small>${hasPoints?`当前有分/登记点 ${x.valid_point_count} / ${x.target_point_count}`:'州级点位数未单独提供'}<br>${weight}</small></button>`}).join('');const detailRows=rows.map(x=>`<tr><td>${escapeHtml(x.name||'')}</td><td>${x.score===null||x.score===undefined?'暂无':fmt(x.score,2)}</td><td>${x.valid_point_count??'—'} / ${x.target_point_count??'—'}</td><td>${x.production_weight_share===null||x.production_weight_share===undefined?'未提供':fmt(x.production_weight_share*100,2)+'%'}</td><td>${escapeHtml(networkStatusLabels[x.status]||x.status||'—')}</td></tr>`).join('');const weightHeading=r.id==='china'?'七组内官方面积代理权重':'登记网络内产量权重占比';return `<section class="region-network-panel"><div class="region-network-head"><div><span class="region-detail-kicker">国家内部产区</span><h3>${escapeHtml(regionShortNames[r.id]||r.name)} · 选择地区查看具体因子</h3><p>点击州、邦、棉区或 AOI，查看该地区自己的14日原始天气和当前单因子评分；带虚线下划线的数值可查看该地区自己的季节图。</p></div><span class="region-network-count">${rows.length} 个地区</span></div><div class="subregion-strip">${cards||'<div class="watch-na">暂无地区分项</div>'}</div>${subregionDetail(r,chosen)}<details class="network-details selected-network-details"><summary>展开完整州／邦／AOI 表格</summary><div class="balance"><table><thead><tr><th>地区</th><th>分数</th><th>当前有分/登记点</th><th>${weightHeading}</th><th>状态</th></tr></thead><tbody>${detailRows}</tbody></table></div></details></section>`}

        const monthStarts=[];(M.day_keys||[]).forEach((key,i)=>{if(i===0||key.endsWith('-01'))monthStarts.push([i,Number(key.slice(0,2))])});monthStarts.forEach(([idx,month])=>{const x=X(Math.min(n-1,idx)),nextYear=M.cross_year_axis&&month<Number(M.season_start_month||1);s+=`<line x1="${x.toFixed(1)}" y1="${H-padB}" x2="${x.toFixed(1)}" y2="${H-padB+4}" stroke="#cbd5e1"/><text x="${x.toFixed(1)}" y="${H-10}" font-size="10" fill="#64748b" text-anchor="middle">${nextYear?'次年':''}${month}月</text>`});
        s+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#cbd5e1"/><line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#cbd5e1"/><text x="10" y="${padT+2}" font-size="10" fill="#64748b">${fmt(hi,1)}</text><text x="10" y="${H-padB}" font-size="10" fill="#64748b">${fmt(lo,1)}</text></svg></div>`;return s;
      }

    }
    function render(){const world=DATA.supply[0],r=DATA.regions.find(x=>x.id===selected),central=(DATA.central_asia_watch||{}).aois||[],ca=central.find(x=>x.id===centralSelected)||central[0];document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="28" r="12" fill="white"/><circle cx="42" cy="28" r="12" fill="white"/><circle cx="32" cy="19" r="12" fill="white"/><path d="M20 35c7 12 17 15 24 0-3 16-21 20-24 0Z" fill="#a8e6cf"/></svg></span><div><h1>棉花供需与天气胁迫看板 V0.7</h1><p>公开版 · 原始天气、模型因子与中亚天气异常度</p></div></div><span class="fresh">USDA供需截止 ${DATA.snapshot_as_of_date}</span></header><section class="hero"><div><span class="eyebrow">全球供需锚点</span><h2>${DATA.conclusion}</h2><p class="hero-note">当前天气原值（14日）与模型天气胁迫分分开展示；原值是棉区点位网络聚合，不是单站实测，也不是减产比例。五个评分区采用各自作物阶段与因子合同；中亚十个 AOI 仅显示当地天气异常度。</p></div><div class="hero-side"><div class="hero-stat"><span>全球产量变化</span><b class="${cls(world.production_change_pct)}">${signed(world.production_change_pct,2,'%')}</b></div><div class="hero-stat"><span>全球消费变化</span><b>${signed(world.domestic_use_change_pct,2,'%')}</b></div><div class="hero-stat"><span>期末库存变化</span><b class="${cls(world.ending_stocks_change_pct)}">${signed(world.ending_stocks_change_pct,2,'%')}</b></div><div class="hero-stat"><span>库存消费比</span><b class="tight">${fmt(world.stocks_to_use,2)}%</b></div></div></section><section class="section"><div class="section-head"><div><h2>五个棉区天气胁迫</h2><p>点击地区查看14日原始天气与模型因子；悬停带下划线指标查看季节性图</p></div><p>原始天气保留 °C / mm / MJ/m²/日；模型分为0—100</p></div><div class="region-grid">${DATA.regions.map(regionCard).join('')}</div><div id="regionDetail">${detail(r)}</div></section><section class="section"><div class="section-head"><div><h2>中亚五国天气观察</h2><p>10 个 AOI · 天气异常度 10/10 可用；棉花胁迫分 0/10 可用；异常度不可横向排名</p></div><p>天气截至 ${DATA.central_asia_watch.as_of_weather_date} · ERA5 仅再分析</p></div><div class="central-grid">${central.map(centralCard).join('')}</div><div id="centralDetail">${ca?centralDetail(ca):'<div class="panel">暂无可用值</div>'}</div></section><section class="section"><div class="section-head"><div><h2>官方供需明细</h2><p>${DATA.official_report_month} · USDA FAS · 面积为千公顷，其余数量为千包（480 磅）</p></div><a href="${DATA.official_source.url}" target="_blank" rel="noreferrer">查看官方报告 ↗</a></div><div class="balance"><table><thead><tr><th>地区</th><th>收获面积</th><th>产量</th><th>产量变化</th><th>国内消费</th><th>消费变化</th><th>进口</th><th>出口</th><th>期末库存</th><th>库存变化</th><th>库存消费比</th><th>比率变化</th></tr></thead><tbody>${DATA.supply.map(balanceRow).join('')}</tbody></table></div><p class="panel-sub">澳大利亚 USDA 官方供需变化已接入；天气指数未换算产量。中亚 AOI 不加入此供需表。</p></section><section class="section method"><article class="panel"><h3>指标怎么读</h3><ul><li>五个评分区总分与分项分数均为 0—100 理论天气胁迫指数；原始天气是带单位的14日点位网络聚合；两者不直接代表产量影响。</li><li>降水原值与过量降雨／收获期降雨模型分独立显示；新疆春季风害因子保留。</li><li>带下划线指标可查看当地季节轴的历史带、去年和今年；raw 使用原始单位，score 使用固定0—100。</li><li>“暂无可用值”或“未计算”表示阶段不适用、未纳入、覆盖不足或数据缺口，不代表0胁迫。</li></ul></article><article class="panel"><h3>公开展示边界</h3><ul><li>指数尚未校准为减产比例、全国减产数量、概率或因果估计。</li><li>正式 global_numeric_weather_score 仍未生成；上方五区产量加权分仅为展示合成，未执行天气到供给数量的换算。</li><li>页面区分5个理论胁迫指数地区、raw天气原值与10个描述性异常度AOI；当地异常度不能跨区排名。</li></ul></article></section><footer class="footer">数据来源：USDA Foreign Agricultural Service；天气侧为已验收的当地棉区点位序列和中亚 ERA5 描述层。页面仅供信息参考，不构成交易建议。</footer>`;document.querySelectorAll('[data-region]').forEach(btn=>btn.addEventListener('click',(e)=>{if(e.target.closest('.chartable'))return;selected=btn.dataset.region;render();document.getElementById('regionDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}));document.querySelectorAll('[data-subregion-id]').forEach(btn=>btn.addEventListener('click',(e)=>{if(e.target.closest('.chartable'))return;subregionSelected[selected]=btn.dataset.subregionId;render();document.getElementById('selectedSubregionDetail')?.scrollIntoView({behavior:'smooth',block:'nearest'})}));document.querySelectorAll('[data-central-id]').forEach(btn=>btn.addEventListener('click',()=>{centralSelected=btn.dataset.centralId;render();document.getElementById('centralDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}));attachCharts();}

  <script>
    /* V0.7 production-weighted display is inserted before chart binding so it uses the same chart popover. */
    (function(){
      const weightedId='five_region_production_weighted_weather_stress_display';
      const productionWeightedLabel='全球棉花五大种植区域天气胁迫总评分（产区产量加权）';
      const baseAttachCharts=attachCharts;
      const baseRender=render;
      const v07Esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const v07Fmt=(v,d=2)=>v===null||v===undefined?'暂无':Number(v).toFixed(d);
      function weightedPanel(c){
        if(!c)return '';
        const rows=(c.weights||[]).map(w=>`<tr><td>${v07Esc(w.name)}</td><td>${v07Esc(w.geography)}</td><td>${v07Esc(w.production_1000_480lb_bales.toLocaleString())}</td><td>${v07Fmt(w.production_weight_pct,2)}%</td></tr>`).join('');
        const regionDates=(DATA.regions||[]).map(r=>r.date).filter(Boolean),latestRegionDate=regionDates.length?[...regionDates].sort().at(-1):c.common_cutoff_date;
        const laggingRegions=(DATA.regions||[]).filter(r=>r.date===c.common_cutoff_date&&r.date<latestRegionDate).map(r=>r.name);
        const currentRegionCount=Math.max(0,(DATA.regions||[]).length-laggingRegions.length);
        const cutoffNote=laggingRegions.length
          ?`共同截止 ${v07Esc(c.common_cutoff_date)}（${laggingRegions.map(v07Esc).join('、')}当地完整日；其他${currentRegionCount}区已更新至 ${v07Esc(latestRegionDate)}）`
          :`共同截止 ${v07Esc(c.common_cutoff_date)}`;
        if(c.label!==productionWeightedLabel)throw new Error('production-weighted display label does not match V0.7 contract');
        return `<section class="section weighted-score-section" id="weightedCompositeSection"><div class="section-head"><div><h2>${productionWeightedLabel}</h2><p>仅为未校准的展示合成；点击或悬停总分查看 04-01—11-30 季节图</p></div><p>${cutoffNote} · 覆盖率 ${v07Fmt(c.weighted_production_coverage*100,1)}%</p></div><div class="hero" style="margin-top:0"><div><span class="eyebrow">产区产量加权展示分</span><h2 class="chartable production-weighted-score" data-chart-region="${weightedId}" data-chart-metric="score" data-chart-title="${productionWeightedLabel}">${v07Fmt(c.current_score,2)} / 100</h2><p class="hero-note">仅按五个来源区官方产量权重聚合各自理论胁迫分；中国棉花种植区以新疆为代表，未包含中国疆外种棉区。总分为0—100未校准展示合成，不是减产率、产量预测或交易信号；地区组合变化可能同时影响曲线，覆盖不足不按0处理。</p></div><div class="hero-side"><div class="hero-stat"><span>共同截止日</span><b>${v07Esc(c.common_cutoff_date)}</b></div><div class="hero-stat"><span>最新地区日</span><b>${v07Esc(latestRegionDate)}</b></div><div class="hero-stat"><span>有效产量覆盖</span><b>${v07Fmt(c.weighted_production_coverage*100,1)}%</b></div></div></div><details class="production-weighted-details"><summary>产量加权详情</summary><div class="balance"><table><thead><tr><th>地区</th><th>地理</th><th>当前产量（千包）</th><th>五区权重</th></tr></thead><tbody>${rows}</tbody></table></div></details></section>`;
      }
      attachCharts=function(){
        const app=document.getElementById('app'),c=(typeof DATA!=='undefined'&&DATA?DATA:{})[weightedId];
        if(app&&c&&!document.getElementById('weightedCompositeSection')){
          const first=app.querySelector('.hero');
          if(first){first.insertAdjacentHTML('beforebegin',weightedPanel(c));}
          const h=app.querySelector('.brand h1'); if(h)h.textContent='棉花供需与天气胁迫看板 V0.7';
        }
        baseAttachCharts();
      };
      render=function(){
        baseRender();
        const app=document.getElementById('app');
        const regionHeading=[...app.querySelectorAll('.section-head h2')].find(el=>el.textContent.trim()==='五个棉区天气胁迫');
        if(regionHeading){regionHeading.textContent='五个棉区天气胁迫 · 分区域查看';const p=regionHeading.parentElement?.querySelector('p');if(p)p.textContent='先选择国家，再选择内部州、邦、棉区或 AOI 查看具体天气因子';}
        const supplyAnchor=[...app.children].find(el=>el.tagName==='SECTION'&&el.classList.contains('hero'));
        const supplyTable=[...app.children].find(el=>el.tagName==='SECTION'&&el.querySelector('.section-head h2')?.textContent.trim()==='官方供需明细');
        if(supplyAnchor&&supplyTable){supplyAnchor.className='supply-anchor';supplyAnchor.id='supplyAnchor';supplyTable.classList.add('supply-table-section');supplyTable.id='supplyTableSection';supplyTable.insertAdjacentElement('beforebegin',supplyAnchor);}
        const c=(typeof DATA!=='undefined'&&DATA?DATA:{})[weightedId],score=app.querySelector('.production-weighted-score');
        if(c&&score){
          score.setAttribute('aria-label',`${productionWeightedLabel} ${v07Fmt(c.current_score,2)} / 100，点击查看季节图`);
          score.innerHTML=`<span class="production-score-value">${v07Fmt(c.current_score,2)}</span><span class="production-score-scale"><span class="production-score-denominator">/ 100</span><small>天气胁迫分</small></span>`;
          const panel=app.querySelector('#weightedCompositeSection'),heading=panel?.querySelector('.section-head>div'),title=heading?.querySelector('h2'),subtitle=heading?.querySelector('p'),main=panel?.querySelector('.hero>div:first-child'),stats=panel?.querySelector('.hero-side');
          if(panel&&heading&&title&&main&&stats){
            panel.classList.add('cotton-score-hero');
            heading.insertAdjacentHTML('afterbegin','<span class="cotton-hero-kicker">天气胁迫 · 五区产量加权展示分</span>');
            title.classList.add('cotton-hero-title');
            title.innerHTML='全球棉花五大种植区域天气胁迫总评分 <span class="cotton-hero-status">（产区产量加权 · 未校准）</span>';
            if(subtitle)subtitle.textContent='点击总分或按钮查看 04-01—11-30 季节图';
            const boundedScore=Math.max(0,Math.min(100,Number(c.current_score)));
            score.insertAdjacentHTML('afterend',`<div class="cotton-score-position" aria-label="0到100理论天气胁迫位置，当前 ${v07Fmt(boundedScore,2)}"><i style="width:${boundedScore}%"></i><span style="left:${boundedScore}%"></span></div><div class="cotton-score-position-caption"><span>0</span><em>分数越高，表示当地天气理论胁迫越强；不是减产百分比，也未做产量校准</em><span>100</span></div><div class="cotton-score-actions"><button type="button" class="cotton-seasonal-button">查看总分季节图</button></div>`);
            const existingStats=[...stats.querySelectorAll('.hero-stat')];
            if(existingStats[0])existingStats[0].insertAdjacentHTML('beforeend','<small>五区共同可比日</small>');
            if(existingStats[1])existingStats[1].insertAdjacentHTML('beforeend','<small>纳入权重的有效产量</small>');
            const validCount=(c.valid_region_ids||[]).length,totalCount=(c.weights||[]).length,totalProduction=Number(c.production_total_1000_480lb_bales||0).toLocaleString('zh-CN');
            stats.insertAdjacentHTML('beforeend',`<div class="hero-stat"><span>覆盖产区</span><b>${validCount} / ${totalCount}</b><small>中国·新疆、美国、巴西、印度、澳大利亚</small></div><div class="hero-stat"><span>加权口径</span><b>USDA 当前产量</b><small>五区合计 ${totalProduction} 千包</small></div>`);
            panel.querySelector('.cotton-seasonal-button')?.addEventListener('click',()=>score.click());
          }
        }
      };
    })();
  </script>
