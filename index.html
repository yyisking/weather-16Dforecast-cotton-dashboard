  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111b32'/%3E%3Ccircle cx='22' cy='28' r='12' fill='white'/%3E%3Ccircle cx='42' cy='28' r='12' fill='white'/%3E%3Ccircle cx='32' cy='19' r='12' fill='white'/%3E%3Cpath d='M20 35c7 12 17 15 24 0-3 16-21 20-24 0Z' fill='%23a8e6cf'/%3E%3C/svg%3E">
  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#eaf0f8 0,#f6f8fb 22rem);color:var(--ink);font:16px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    a{color:inherit}.shell{width:min(1440px,calc(100% - 32px));margin:auto;padding:22px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border-radius:13px;background:var(--navy);display:grid;place-items:center;box-shadow:0 8px 24px rgba(17,27,50,.25)}.mark svg{width:28px}.brand h1{font-size:1.22rem;line-height:1.2;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:.86rem}.fresh{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;color:var(--muted);font-size:.85rem;white-space:nowrap}
    .hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:18px;background:var(--navy);color:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(17,27,50,.22);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:300px;height:300px;border:70px solid rgba(77,132,255,.12);border-radius:50%;right:-150px;top:-170px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:#9dc4ff;font-size:.76rem}.hero h2{font-size:clamp(1.55rem,3vw,2.45rem);line-height:1.25;margin:12px 0 14px;max-width:840px}.hero-note{color:#b9c8df;margin:0;max-width:800px}.hero-side{align-self:stretch;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:1}.hero-stat{padding:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:15px}.hero-stat span{display:block;font-size:.78rem;color:#aebed5}.hero-stat b{display:block;font-size:1.3rem;margin-top:5px}.tight{color:#ffcf75}.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:13px}.section h2{margin:0;font-size:1.27rem}.section-head p{margin:0;color:var(--muted);font-size:.9rem}.region-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.region-card{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.2s ease;text-align:left;color:inherit;font:inherit}.region-card:hover,.region-card.active{transform:translateY(-3px);border-color:#91aef0;box-shadow:0 20px 45px rgba(39,98,214,.13)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-head h3{margin:0;font-size:1rem}.asof{font-size:.75rem;color:var(--muted)}.score{font-size:2.35rem;line-height:1;font-weight:780;letter-spacing:-.04em;margin:22px 0 6px}.score small{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0}.band{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:.77rem;font-weight:700}.band.low{background:#e8f5ef;color:var(--green)}.band.mild{background:#e9f2ff;color:var(--blue)}.band.moderate{background:#fff1db;color:#a55c00}.band.high{background:#ffe7ec;color:var(--red)}.delta-row{display:flex;gap:12px;margin-top:15px;color:var(--muted);font-size:.81rem}.up{color:var(--red);font-weight:700}.down{color:var(--green);font-weight:700}.flat{color:var(--muted);font-weight:700}.meter{height:7px;background:#edf1f6;border-radius:99px;margin-top:15px;overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
    .detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:18px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.panel h3{margin:0 0 4px;font-size:1.05rem}.panel-sub{margin:0 0 18px;color:var(--muted);font-size:.88rem}.factor-list{display:grid;gap:13px}.factor{display:grid;grid-template-columns:150px minmax(100px,1fr) 58px;align-items:center;gap:12px}.factor-label{font-size:.88rem}.factor-track{height:10px;background:#edf1f6;border-radius:99px;overflow:hidden}.factor-track i{height:100%;display:block;background:linear-gradient(90deg,#3b7bdc,#7d5ad8);border-radius:inherit}.factor-value{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.na{color:#93a0b2;font-weight:500;font-size:.77rem}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:12px;border-radius:14px;background:#f6f8fb}.fact span{font-size:.76rem;color:var(--muted);display:block}.fact b{font-size:.9rem;display:block;margin-top:3px}.risk-box{grid-column:1/-1;background:#eef4ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:9px;font-size:.88rem}.gap-list{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:.8rem;max-height:90px;overflow:auto}.central-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.central-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}.central-card.active,.central-card:hover{border-color:#91aef0;box-shadow:0 16px 34px rgba(39,98,214,.12)}.central-card h3{font-size:.95rem;margin:0 0 4px}.central-card .central-score{font-size:1.1rem;font-weight:750;margin-top:12px}.central-card .central-muted{font-size:.77rem;color:var(--muted)}.central-anomaly{font-size:1.1rem;font-weight:750;margin-top:12px}.central-anomaly-track{height:7px;background:#edf1f6;border-radius:99px;margin-top:8px;overflow:hidden}.central-anomaly-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet))}.central-card .central-secondary{font-size:.73rem;color:var(--muted)}.central-detail{margin-top:14px}.watch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.watch-metric{padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.watch-metric b{display:block;font-size:.95rem}.watch-metric span{font-size:.76rem;color:var(--muted)}.watch-metric .watch-values{margin-top:7px;font-variant-numeric:tabular-nums}.watch-na{color:#7a8798;font-size:.8rem}.watch-warning{background:#fff8e8;border-left:4px solid var(--amber);padding:12px 14px;border-radius:9px;font-size:.85rem;margin-top:12px}
    .chartable{border-bottom:1px dashed var(--blue);cursor:pointer}.chartable:hover{color:var(--blue)}#chart-pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(15,23,42,.18);padding:8px;display:none;max-width:calc(100vw - 16px)}#chart-pop svg{display:block;max-width:94vw;height:auto}#chart-pop .chart-close{position:absolute;top:3px;right:8px;color:var(--muted);cursor:pointer;font-size:15px;line-height:1.2;z-index:1}.chart-modal{position:fixed;inset:0;z-index:40;display:none}.chart-modal .chart-back{position:absolute;inset:0;background:rgba(15,23,42,.52)}.chart-modal .chart-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:18px 12px 10px;max-width:calc(100vw - 20px);max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 24px 80px rgba(15,23,42,.3)}.chart-modal .chart-body svg{width:min(90vw,900px);height:auto;display:block}.chart-modal .chart-close{position:absolute;top:5px;right:12px;color:var(--muted);cursor:pointer;font-size:20px;line-height:1.2;z-index:1}
    .balance{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:13px 14px;border-bottom:1px solid #e8edf3;text-align:right;white-space:nowrap}th{font-size:.76rem;color:var(--muted);font-weight:650;background:#f8fafc;position:sticky;top:0}td{font-size:.86rem;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;font-weight:700}tr:last-child td{border-bottom:0}.negative{color:var(--red)}.positive{color:var(--green)}
    .method{display:grid;grid-template-columns:1fr 1fr;gap:14px}.method .panel{box-shadow:none}.method h3{font-size:.95rem}.method p,.method li{font-size:.84rem;color:var(--muted)}.method ul{padding-left:20px;margin:10px 0 0}.footer{margin-top:24px;color:var(--muted);font-size:.78rem;text-align:center}.error{margin:80px auto;max-width:720px;background:#fff;border:1px solid #f0b8c1;padding:24px;border-radius:18px}.skeleton{min-height:380px;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:1250px){.region-grid,.central-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:1050px){.region-grid,.central-grid{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:680px){.shell{width:min(100% - 20px,1440px);padding-top:12px}.topbar{align-items:flex-start}.fresh{font-size:.75rem}.brand p{display:none}.hero{padding:22px;border-radius:19px}.hero-side{grid-template-columns:1fr 1fr}.region-grid,.central-grid{grid-template-columns:1fr}.method{grid-template-columns:1fr}.factor{grid-template-columns:112px minmax(80px,1fr) 52px}.watch-grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.score{margin-top:14px}.facts{grid-template-columns:1fr}}

<body>
  <main class="shell" id="app"><div class="skeleton">正在载入已验收数据…</div></main>
  <script>
    const fmt=(v,d=1)=>v===null||v===undefined?'暂无可用值':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
    const signed=(v,d=1,suffix='')=>v===null||v===undefined?'暂无':`${v>0?'+':''}${fmt(v,d)}${suffix}`;
    const cls=v=>v===null||v===undefined?'flat':v>0?'up':v<0?'down':'flat';
    const arrow=v=>v===null||v===undefined?'—':v>0?'↑':v<0?'↓':'→';
    const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const factorLabels={high_heat:'高温',root_zone_dryness:'根区干旱',harvest_rain:'收获期降雨',excess_rain:'过量降雨',low_temperature:'低温',hot_dry_compound:'高温干旱复合',excess_rain_waterlogging:'过量降雨／渍涝',high_vpd:'高 VPD',low_solar:'低太阳辐射'};
    const centralVariableLabels={temperature_2m_max:'14日平均最高温',temperature_2m_min:'14日平均最低温',precipitation_sum:'14日累计降水',shortwave_radiation_sum:'14日累计短波辐射',et0_fao_evapotranspiration:'14日累计参考蒸散',vapour_pressure_deficit_max:'14日平均最大VPD'};
    const centralDailyVariableLabels={temperature_2m_max:'日最高温',temperature_2m_min:'日最低温',precipitation_sum:'日降水',shortwave_radiation_sum:'日短波辐射',et0_fao_evapotranspiration:'日参考蒸散',vapour_pressure_deficit_max:'日最大VPD'};
    let DATA,selected='china',centralSelected='kazakhstan_turkistan';
    function regionCard(r){return `<button class="region-card ${r.id===selected?'active':''}" data-region="${r.id}" aria-label="查看${r.name}分项指标"><div class="card-head"><div><h3>${r.name}</h3><span class="asof">数据至 ${r.date}</span></div><span class="band ${r.band}">${r.band_display}胁迫</span></div><div class="score chartable" data-chart-region="${r.id}" data-chart-metric="score" data-chart-title="${escapeHtml(r.name)} · 综合天气胁迫">${fmt(r.score,2)} <small>/ 100</small></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,r.score||0))}%"></i></div><div class="delta-row"><span>周环比 <b class="${cls(r.change_7d)}">${arrow(r.change_7d)} ${signed(r.change_7d,2)}</b></span><span>同比 <b class="${cls(r.change_yoy)}">${arrow(r.change_yoy)} ${signed(r.change_yoy,2)}</b></span></div></button>`}
    function detail(r){const seasonal=((DATA.seasonal||{})[r.id]||{}).metrics||{};const factors=r.factors.map(f=>{const hasChart=Boolean(seasonal[f.id]);const label=`<span class="factor-label${hasChart?' chartable':''}" ${hasChart?`data-chart-region="${r.id}" data-chart-metric="${f.id}" data-chart-title="${escapeHtml(r.name)} · ${escapeHtml(f.label)}"`:''}>${escapeHtml(f.label)}</span>`;return `<div class="factor">${label}${f.score===null?'<span class="na">当前阶段未纳入／暂无可用值</span><span class="factor-value na">—</span>':`<span class="factor-track"><i style="width:${Math.max(0,Math.min(100,f.score))}%"></i></span><span class="factor-value">${fmt(f.score,2)}</span>`}</div>`}).join('');const drivers=r.drivers.map(d=>factorLabels[d.factor_id]||d.factor_id).slice(0,3).join('、')||'暂无';const s=r.official_supply;const supplyDetail=s?`<div class="fact"><span>USDA产量变化</span><b>${signed(s.production_change_1000_480lb_bales,0,' 千包')}（${signed(s.production_change_pct,2,'%')}）</b></div><div class="fact"><span>USDA期末库存变化</span><b>${signed(s.ending_stocks_change_1000_480lb_bales,0,' 千包')}（${signed(s.ending_stocks_change_pct,2,'%')}）</b></div><div class="fact"><span>国内消费变化率</span><b>${s.domestic_use_change_pct===null?'不可计算（上年国内消费为0）':signed(s.domestic_use_change_pct,2,'%')}</b></div>`:'';return `<div class="detail"><section class="panel"><h3>${r.name} · 分项因子</h3><p class="panel-sub">各因素按当地合同独立计算；悬停带下划线的指标可查看历史季节性图。</p><div class="factor-list">${factors}</div></section><aside class="panel"><h3>当前解释</h3><p class="panel-sub">分数越高，天气不利潜力越强。</p><div class="facts"><div class="fact"><span>生育阶段</span><b>${r.stage_display}</b></div><div class="fact"><span>主要驱动</span><b>${escapeHtml(drivers)}</b></div><div class="fact"><span>点位覆盖率</span><b>${r.point_coverage===null?'暂无':fmt(r.point_coverage*100,0)+'%'}</b></div><div class="fact"><span>因子权重覆盖率</span><b>${r.factor_weight_coverage===null?'暂无':fmt(r.factor_weight_coverage*100,0)+'%'}</b></div><div class="fact"><span>可信度</span><b>${r.confidence_display}</b></div><div class="fact"><span>来源状态</span><b>${r.source_mode}</b></div>${supplyDetail}<div class="risk-box">${escapeHtml(r.supply_risk_reading)}；该判断未改写 USDA 产量。</div></div>${r.gap_codes.length?`<ul class="gap-list"><li>${r.gap_codes.map(escapeHtml).join('</li><li>')}</li></ul>`:''}</aside></div>`}
    function centralCard(a){const score=a.weather_anomaly_score;return `<button class="central-card ${a.id===centralSelected?'active':''}" data-central-id="${a.id}"><h3>${escapeHtml(a.country_display_name||a.country)} · ${escapeHtml(a.aoi_display_name||a.aoi_name)}</h3><div class="central-secondary">${escapeHtml(a.country)} · ${escapeHtml(a.aoi_name)}</div><div class="central-anomaly">天气异常度：${score===null?'暂无':fmt(score,2)} <small>/ 100</small></div><div class="central-anomaly-track"><i style="width:${Math.max(0,Math.min(100,score||0))}%"></i></div><div class="central-muted">天气截至 ${DATA.central_asia_watch.as_of_weather_date} · 胁迫分未计算</div></button>`}
    function centralDetail(a){const seasonal=(DATA.central_asia_seasonal||{})[a.id]||{};const metrics=seasonal.metrics||{};const cards=Object.keys(centralVariableLabels).map(v=>{const p=a[v+'_percentile'],m=metrics[v],currentLabel=centralVariableLabels[v],dailyLabel=(m&&m.label)||centralDailyVariableLabels[v];const chart=m?`<span class="chartable" data-chart-region="${a.id}" data-chart-metric="${v}" data-chart-title="${escapeHtml(a.aoi_display_name||a.aoi_name)} · ${escapeHtml(dailyLabel)}">${escapeHtml(currentLabel)}</span>`:escapeHtml(currentLabel);return `<div class="watch-metric"><b>${chart}</b><span>${escapeHtml(m?.unit||'')}</span><div class="watch-values">当前 ${escapeHtml(a[v+'_current'])} · 同比 ${signed(Number(a[v+'_change_yoy']),3)}<br>同期百分位 ${escapeHtml(p)} · ${escapeHtml(a[v+'_band'])}</div></div>`}).join('');const gaps=(a.gap_codes||'').split(';').filter(Boolean);const anomaly=a.weather_anomaly_score;return `<div class="detail central-detail"><section class="panel"><h3>${escapeHtml(a.country_display_name||a.country)} · ${escapeHtml(a.aoi_display_name||a.aoi_name)} · 六变量天气观察</h3><p class="panel-sub">卡片显示 14 日聚合值；点击变量名查看裁剪后的当地季节窗口日序列。天气异常度只表示偏离当地常态，不代表更不利或减产。</p><div class="watch-grid">${cards}</div><div class="watch-warning">${escapeHtml(a.qualitative_watch_note)}<br>stage：${escapeHtml(a.stage_evidence_status)} · ${escapeHtml(a.stage_proxy_pit_status)}<br>stage proxy：${escapeHtml(a.stage_proxy||'暂无可用值')} · ${escapeHtml(a.stage_proxy_date||'暂无日期')} · ${escapeHtml(a.stage_proxy_scope||'暂无范围')}</div></section><aside class="panel"><h3>状态与边界</h3><div class="facts"><div class="fact"><span>天气异常度</span><b>${anomaly===null?'暂无可用值':fmt(anomaly,2)+' / 100'}</b></div><div class="fact"><span>棉花胁迫分</span><b>未计算（0/10 AOI 可用）</b></div><div class="fact"><span>可信度</span><b>${escapeHtml(a.confidence)}</b></div><div class="fact"><span>天气来源</span><b>ERA5 · 仅再分析</b></div><div class="fact"><span>生产链接</span><b>${escapeHtml(a.production_link_status)}</b></div></div>${gaps.length?`<ul class="gap-list"><li>${gaps.map(escapeHtml).join('</li><li>')}</li></ul>`:''}</aside></div>`}
    function balanceRow(r){return `<tr><td>${r.name}</td><td>${fmt(r.area_harvested,0)}</td><td>${fmt(r.production,0)}</td><td class="${cls(r.production_change_pct)}">${signed(r.production_change_pct,2,'%')}</td><td>${fmt(r.domestic_use,0)}</td><td class="${cls(r.domestic_use_change_pct)}">${signed(r.domestic_use_change_pct,2,'%')}</td><td>${fmt(r.imports,0)}</td><td>${fmt(r.exports,0)}</td><td>${fmt(r.ending_stocks,0)}</td><td class="${cls(r.ending_stocks_change_pct)}">${signed(r.ending_stocks_change_pct,2,'%')}</td><td>${fmt(r.stocks_to_use,2)}%</td><td class="${cls(r.stocks_to_use_change_pp)}">${signed(r.stocks_to_use_change_pp,2,'pp')}</td></tr>`}
    function attachCharts(){
      const pop=document.getElementById('chart-pop')||(()=>{const el=document.createElement('div');el.id='chart-pop';document.body.appendChild(el);return el;})();
      const modal=document.getElementById('chart-modal')||(()=>{const el=document.createElement('div');el.id='chart-modal';el.className='chart-modal';el.innerHTML='<div class="chart-back"></div><div class="chart-box"><span class="chart-close">✕</span><div class="chart-body"></div></div>';document.body.appendChild(el);el.querySelector('.chart-back').addEventListener('click',()=>{el.style.display='none'});el.querySelector('.chart-close').addEventListener('click',()=>{el.style.display='none'});return el;})();
      let hideTimer=null;
      const hide=()=>{pop.style.display='none'};
      const scheduleHide=()=>{clearTimeout(hideTimer);hideTimer=setTimeout(hide,240)};
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function renderChart(el){
        const rid=el.dataset.chartRegion,metric=el.dataset.chartMetric;
        const source=((DATA.seasonal||{})[rid]||(DATA.central_asia_seasonal||{})[rid]||{});
        const M=(source.metrics||{})[metric];
        if(!M)return '';
        const W=560,H=300,padL=48,padR=16,padT=70,padB=34,n=(M.day_keys||[]).length||365;
        const finiteValue=v=>v!==null&&v!==undefined&&Number.isFinite(Number(v));
        const arrays=[M.history_min,M.history_max,M.last_year,M.current_year];
        const vals=[];arrays.forEach(a=>(a||[]).forEach(v=>{if(finiteValue(v))vals.push(Number(v))}));
        if(!vals.length)return '';
        const fixed=M.scale_type==='fixed_score_0_100';
        let lo=fixed?Number(M.scale_min):Math.min(...vals),hi=fixed?Number(M.scale_max):Math.max(...vals);
        if(!fixed&&hi-lo<1e-9){hi=lo+1}const extra=fixed?0:(hi-lo)*.12;lo-=extra;hi+=extra;
        const X=i=>padL+(i/Math.max(1,n-1))*(W-padL-padR),Y=v=>padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);
        const line=a=>{let d='',pen=false;(a||[]).forEach((v,i)=>{if(!finiteValue(v)){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(Number(v)).toFixed(1);pen=true});return d};
        const bandPaths=()=>{const upper=M.history_max||[],lower=M.history_min||[],paths=[];let start=null;for(let i=0;i<n;i++){const valid=finiteValue(upper[i])&&finiteValue(lower[i]);if(valid&&start===null)start=i;if((!valid||i===n-1)&&start!==null){const end=valid&&i===n-1?i:i-1;if(end-start>=1){const top=[];const bot=[];for(let j=start;j<=end;j++){top.push([j,Number(upper[j])]);bot.push([j,Number(lower[j])])}paths.push('M'+top.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')+'L'+bot.reverse().map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')+'Z')}start=null}}return paths};
        const statusRuns=status=>{const runs=[];let start=0,current=status[0]||'available';for(let i=1;i<=n;i++){const next=i<n?(status[i]||'available'):null;if(next!==current){if(current!=='available')runs.push([start,i-1,current]);start=i;current=next}}return runs};
        const title=el.dataset.chartTitle||M.label;let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}历史季节性图"><text x="2" y="17" font-size="14" font-weight="700" fill="#0b1220">${esc(title)}</text><text x="${W-4}" y="17" font-size="11" fill="#64748b" text-anchor="end">单位：${esc(M.unit||'暂无')} · ${esc(M.value_semantics||M.window||'')}</text><text x="2" y="34" font-size="10.5" fill="#64748b">${esc(M.blank_value_label||'空值按来源状态解释')}</text>`;
        let lx=2;const legend=(color,label,dash='')=>{s+=`<line x1="${lx}" y1="51" x2="${lx+16}" y2="51" stroke="${color}" stroke-width="2.4"${dash?' stroke-dasharray="5,4"':''}/><text x="${lx+20}" y="54.5" font-size="10.5" fill="#475569">${esc(label)}</text>`;lx+=24+label.length*11};
        const inactiveRuns=statusRuns(M.current_year_status||[]);if(inactiveRuns.length){inactiveRuns.filter(run=>run[2]==='inactive_stage').forEach(run=>{const x0=X(run[0]),x1=X(run[1]);s+=`<rect x="${x0.toFixed(1)}" y="${padT}" width="${Math.max(1,x1-x0)}" height="${H-padT-padB}" fill="#94a3b8" fill-opacity=".13"/>`});legend('#94a3b8','灰色＝该阶段未启用','5,4')}
        const paths=bandPaths();if(paths.length){legend('#94a3b8','历史最大—最小带');paths.forEach(path=>{s+=`<path d="${path}" fill="#94a3b8" fill-opacity=".28" stroke="none"/>`})}
        legend('#2563eb',M.last_year_label+' 去年');legend('#dc3d55',M.current_year_label+' 今年');
        if(M.last_year)s+=`<path d="${line(M.last_year)}" fill="none" stroke="#2563eb" stroke-width="1.8"/>`;if(M.current_year)s+=`<path d="${line(M.current_year)}" fill="none" stroke="#dc3d55" stroke-width="2.6"/>`;
        const counts=M.status_counts||{};const currentCounts=counts.current_year||{};const gapCount=Number(currentCounts.source_gap||0)+Number((counts.last_year||{}).source_gap||0);const futureCount=Number(currentCounts.future||0);if(gapCount||futureCount)s+=`<text x="2" y="${H-1}" font-size="10.5" fill="${gapCount?'#b4233c':'#64748b'}">${gapCount?'源数据缺口：'+gapCount+' 天；':''}${futureCount?'今年尚未来临：'+futureCount+' 天':''}</text>`;
        const monthStarts=[];(M.day_keys||[]).forEach((key,i)=>{if(i===0||key.endsWith('-01'))monthStarts.push([i,Number(key.slice(0,2))])});monthStarts.forEach(([idx,month])=>{const x=X(Math.min(n-1,idx));s+=`<line x1="${x.toFixed(1)}" y1="${H-padB}" x2="${x.toFixed(1)}" y2="${H-padB+4}" stroke="#cbd5e1"/><text x="${x.toFixed(1)}" y="${H-10}" font-size="10" fill="#64748b" text-anchor="middle">${month}月</text>`});
        s+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#cbd5e1"/><line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#cbd5e1"/><text x="10" y="${padT+2}" font-size="10" fill="#64748b">${fmt(hi,1)}</text><text x="10" y="${H-padB}" font-size="10" fill="#64748b">${fmt(lo,1)}</text></svg>`;return s;
      }
      document.querySelectorAll('.chartable[data-chart-region]').forEach(el=>{el.addEventListener('mouseenter',()=>{clearTimeout(hideTimer);const svg=renderChart(el);if(!svg)return;pop.innerHTML='<span class="chart-close">✕</span>'+svg;pop.style.display='block';const r=el.getBoundingClientRect();if(innerWidth<620){pop.style.position='fixed';pop.style.left='50%';pop.style.top='14%';pop.style.transform='translateX(-50%)'}else{pop.style.position='absolute';pop.style.transform='';pop.style.left=Math.max(scrollX+8,Math.min(r.left+scrollX,scrollX+innerWidth-590))+'px';pop.style.top=(r.bottom+scrollY+7)+'px'}pop.querySelector('.chart-close').addEventListener('click',e=>{e.stopPropagation();hide()})});el.addEventListener('mouseleave',scheduleHide);el.addEventListener('click',e=>{e.stopPropagation();const svg=renderChart(el);if(!svg)return;hide();modal.querySelector('.chart-body').innerHTML=svg;modal.style.display='block'})});pop.addEventListener('mouseenter',()=>clearTimeout(hideTimer));pop.addEventListener('mouseleave',scheduleHide);
    }
    function render(){const world=DATA.supply[0],r=DATA.regions.find(x=>x.id===selected),central=(DATA.central_asia_watch||{}).aois||[],ca=central.find(x=>x.id===centralSelected)||central[0];document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="28" r="12" fill="white"/><circle cx="42" cy="28" r="12" fill="white"/><circle cx="32" cy="19" r="12" fill="white"/><path d="M20 35c7 12 17 15 24 0-3 16-21 20-24 0Z" fill="#a8e6cf"/></svg></span><div><h1>棉花供需与天气胁迫看板 V0.4</h1><p>公开版 · 生长期时间轴与中亚天气异常度观察</p></div></div><span class="fresh">数据截止 ${DATA.snapshot_as_of_date}</span></header><section class="hero"><div><span class="eyebrow">全球供需锚点</span><h2>${DATA.conclusion}</h2><p class="hero-note">天气分用于观察当地供给下修风险，不是减产比例。五个评分区采用各自的作物阶段与因子合同；中亚十个 AOI 显示当地天气异常度，不生成棉花胁迫分、跨区排名或伪全球分。</p></div><div class="hero-side"><div class="hero-stat"><span>全球产量变化</span><b class="${cls(world.production_change_pct)}">${signed(world.production_change_pct,2,'%')}</b></div><div class="hero-stat"><span>全球消费变化</span><b>${signed(world.domestic_use_change_pct,2,'%')}</b></div><div class="hero-stat"><span>期末库存变化</span><b class="${cls(world.ending_stocks_change_pct)}">${signed(world.ending_stocks_change_pct,2,'%')}</b></div><div class="hero-stat"><span>库存消费比</span><b class="tight">${fmt(world.stocks_to_use,2)}%</b></div></div></section><section class="section"><div class="section-head"><div><h2>五个棉区天气胁迫</h2><p>点击地区查看分项指标；悬停带下划线的指标查看裁剪后的当地作季图</p></div><p>0 无明显胁迫 → 100 历史参考范围内极端胁迫</p></div><div class="region-grid">${DATA.regions.map(regionCard).join('')}</div><div id="regionDetail">${detail(r)}</div></section><section class="section"><div class="section-head"><div><h2>中亚五国天气观察</h2><p>10 个 AOI · 天气异常度 10/10 可用；棉花胁迫分 0/10 可用；异常度不可横向排名</p></div><p>天气截至 ${DATA.central_asia_watch.as_of_weather_date} · ERA5 仅再分析</p></div><div class="central-grid">${central.map(centralCard).join('')}</div><div id="centralDetail">${ca?centralDetail(ca):'<div class="panel">暂无可用值</div>'}</div></section><section class="section"><div class="section-head"><div><h2>官方供需明细</h2><p>${DATA.official_report_month} · USDA FAS · 面积为千公顷，其余数量为千包（480 磅）</p></div><a href="${DATA.official_source.url}" target="_blank" rel="noreferrer">查看官方报告 ↗</a></div><div class="balance"><table><thead><tr><th>地区</th><th>收获面积</th><th>产量</th><th>产量变化</th><th>国内消费</th><th>消费变化</th><th>进口</th><th>出口</th><th>期末库存</th><th>库存变化</th><th>库存消费比</th><th>比率变化</th></tr></thead><tbody>${DATA.supply.map(balanceRow).join('')}</tbody></table></div><p class="panel-sub">澳大利亚 USDA 官方供需变化已接入；天气指数未换算产量。中亚 AOI 不加入此供需表。</p></section><section class="section method"><article class="panel"><h3>指标怎么读</h3><ul><li>五个评分区总分与分项分数均为 0—100 理论天气胁迫指数；中亚天气异常度是每个 AOI 当地偏离常态的描述量，不计算综合胁迫分。</li><li>红色上升表示不利天气压力增加；绿色下降表示压力缓解。</li><li>带下划线的指标可悬停查看裁剪后的当地作季极值带、去年和今年序列；图中固定 0—100 分数轴，灰色区为该阶段未启用，空值按今年尚未来临或源数据缺口说明。</li><li>“暂无可用值”或“未计算”表示当前阶段不适用、未纳入或证据／数据不足，不代表 0 胁迫。</li></ul></article><article class="panel"><h3>公开展示边界</h3><ul><li>指数尚未校准为减产比例、全国减产数量、概率或因果估计。</li><li>没有生成全球数值天气分，也没有执行天气到供给数量的换算。</li><li>页面区分 5 个理论胁迫指数地区与 10 个描述性异常度 AOI；当地异常度不能跨区排名。</li></ul></article></section><footer class="footer">数据来源：USDA Foreign Agricultural Service；天气侧为项目已验收的当地棉区代理序列和中亚 ERA5 描述层。页面仅供信息参考，不构成交易建议。</footer>`;document.querySelectorAll('[data-region]').forEach(btn=>btn.addEventListener('click',(e)=>{if(e.target.closest('.chartable'))return;selected=btn.dataset.region;render();document.getElementById('regionDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}));document.querySelectorAll('[data-central-id]').forEach(btn=>btn.addEventListener('click',()=>{centralSelected=btn.dataset.centralId;render();document.getElementById('centralDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}));attachCharts();}
