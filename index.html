<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="全球棉花供需平衡与主要产区理论天气胁迫指标公开看板">
  <title>棉花供需与天气胁迫看板</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111b32'/%3E%3Ccircle cx='22' cy='28' r='12' fill='white'/%3E%3Ccircle cx='42' cy='28' r='12' fill='white'/%3E%3Ccircle cx='32' cy='19' r='12' fill='white'/%3E%3Cpath d='M20 35c7 12 17 15 24 0-3 16-21 20-24 0Z' fill='%23a8e6cf'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#0b1220;--muted:#64748b;--line:#dce4ee;--paper:#f4f7fb;--card:#fff;--navy:#111b32;--blue:#2762d6;--cyan:#1b9aaa;--green:#15825d;--amber:#d88312;--red:#cf455c;--violet:#7857d8;--shadow:0 18px 48px rgba(15,23,42,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#eaf0f8 0,#f6f8fb 22rem);color:var(--ink);font:16px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    a{color:inherit}.shell{width:min(1440px,calc(100% - 32px));margin:auto;padding:22px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border-radius:13px;background:var(--navy);display:grid;place-items:center;box-shadow:0 8px 24px rgba(17,27,50,.25)}.mark svg{width:28px}.brand h1{font-size:1.22rem;line-height:1.2;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:.86rem}.fresh{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;color:var(--muted);font-size:.85rem;white-space:nowrap}
    .hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:18px;background:var(--navy);color:#fff;border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(17,27,50,.22);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:300px;height:300px;border:70px solid rgba(77,132,255,.12);border-radius:50%;right:-150px;top:-170px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:#9dc4ff;font-size:.76rem}.hero h2{font-size:clamp(1.55rem,3vw,2.45rem);line-height:1.25;margin:12px 0 14px;max-width:840px}.hero-note{color:#b9c8df;margin:0;max-width:800px}.hero-side{align-self:stretch;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:1}.hero-stat{padding:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:15px}.hero-stat span{display:block;font-size:.78rem;color:#aebed5}.hero-stat b{display:block;font-size:1.3rem;margin-top:5px}.tight{color:#ffcf75}.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:13px}.section h2{margin:0;font-size:1.27rem}.section-head p{margin:0;color:var(--muted);font-size:.9rem}.region-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.region-card{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.2s ease;text-align:left;color:inherit;font:inherit}.region-card:hover,.region-card.active{transform:translateY(-3px);border-color:#91aef0;box-shadow:0 20px 45px rgba(39,98,214,.13)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-head h3{margin:0;font-size:1rem}.asof{font-size:.75rem;color:var(--muted)}.score{font-size:2.35rem;line-height:1;font-weight:780;letter-spacing:-.04em;margin:22px 0 6px}.score small{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0}.band{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:.77rem;font-weight:700}.band.low{background:#e8f5ef;color:var(--green)}.band.mild{background:#e9f2ff;color:var(--blue)}.band.moderate{background:#fff1db;color:#a55c00}.band.high{background:#ffe7ec;color:var(--red)}.delta-row{display:flex;gap:12px;margin-top:15px;color:var(--muted);font-size:.81rem}.up{color:var(--red);font-weight:700}.down{color:var(--green);font-weight:700}.flat{color:var(--muted);font-weight:700}.meter{height:7px;background:#edf1f6;border-radius:99px;margin-top:15px;overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
    .detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:18px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.panel h3{margin:0 0 4px;font-size:1.05rem}.panel-sub{margin:0 0 18px;color:var(--muted);font-size:.88rem}.factor-list{display:grid;gap:13px}.factor{display:grid;grid-template-columns:150px minmax(100px,1fr) 58px;align-items:center;gap:12px}.factor-label{font-size:.88rem}.factor-track{height:10px;background:#edf1f6;border-radius:99px;overflow:hidden}.factor-track i{height:100%;display:block;background:linear-gradient(90deg,#3b7bdc,#7d5ad8);border-radius:inherit}.factor-value{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.na{color:#93a0b2;font-weight:500;font-size:.77rem}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:12px;border-radius:14px;background:#f6f8fb}.fact span{font-size:.76rem;color:var(--muted);display:block}.fact b{font-size:.9rem;display:block;margin-top:3px}.risk-box{grid-column:1/-1;background:#eef4ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:9px;font-size:.88rem}.gap-list{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:.8rem;max-height:90px;overflow:auto}
    .balance{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:13px 14px;border-bottom:1px solid #e8edf3;text-align:right;white-space:nowrap}th{font-size:.76rem;color:var(--muted);font-weight:650;background:#f8fafc;position:sticky;top:0}td{font-size:.86rem;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;font-weight:700}tr:last-child td{border-bottom:0}.negative{color:var(--red)}.positive{color:var(--green)}
    .method{display:grid;grid-template-columns:1fr 1fr;gap:14px}.method .panel{box-shadow:none}.method h3{font-size:.95rem}.method p,.method li{font-size:.84rem;color:var(--muted)}.method ul{padding-left:20px;margin:10px 0 0}.footer{margin-top:24px;color:var(--muted);font-size:.78rem;text-align:center}.error{margin:80px auto;max-width:720px;background:#fff;border:1px solid #f0b8c1;padding:24px;border-radius:18px}.skeleton{min-height:380px;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:1050px){.region-grid{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:680px){.shell{width:min(100% - 20px,1440px);padding-top:12px}.topbar{align-items:flex-start}.fresh{font-size:.75rem}.brand p{display:none}.hero{padding:22px;border-radius:19px}.hero-side{grid-template-columns:1fr 1fr}.region-grid{grid-template-columns:1fr}.method{grid-template-columns:1fr}.factor{grid-template-columns:112px minmax(80px,1fr) 52px}.section-head{align-items:flex-start;flex-direction:column}.score{margin-top:14px}.facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="skeleton">正在载入已验收数据…</div></main>
  <script>
    const fmt=(v,d=1)=>v===null||v===undefined?'暂无可用值':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
    const signed=(v,d=1,suffix='')=>v===null||v===undefined?'暂无':`${v>0?'+':''}${fmt(v,d)}${suffix}`;
    const cls=v=>v===null||v===undefined?'flat':v>0?'up':v<0?'down':'flat';
    const arrow=v=>v===null||v===undefined?'—':v>0?'↑':v<0?'↓':'→';
    const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const factorLabels={high_heat:'高温',root_zone_dryness:'根区干旱',harvest_rain:'收获期降雨',excess_rain:'过量降雨',low_temperature:'低温',hot_dry_compound:'高温干旱复合',excess_rain_waterlogging:'过量降雨／渍涝'};
    let DATA,selected='china';
    function regionCard(r){return `<button class="region-card ${r.id===selected?'active':''}" data-region="${r.id}" aria-label="查看${r.name}分项指标"><div class="card-head"><div><h3>${r.name}</h3><span class="asof">数据至 ${r.date}</span></div><span class="band ${r.band}">${r.band_display}胁迫</span></div><div class="score">${fmt(r.score,2)} <small>/ 100</small></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,r.score||0))}%"></i></div><div class="delta-row"><span>周环比 <b class="${cls(r.change_7d)}">${arrow(r.change_7d)} ${signed(r.change_7d,2)}</b></span><span>同比 <b class="${cls(r.change_yoy)}">${arrow(r.change_yoy)} ${signed(r.change_yoy,2)}</b></span></div></button>`}
    function detail(r){const factors=r.factors.map(f=>`<div class="factor"><span class="factor-label">${f.label}</span>${f.score===null?'<span class="na">当前阶段未纳入／暂无可用值</span><span class="factor-value na">—</span>':`<span class="factor-track"><i style="width:${Math.max(0,Math.min(100,f.score))}%"></i></span><span class="factor-value">${fmt(f.score,2)}</span>`}</div>`).join('');const drivers=r.drivers.map(d=>factorLabels[d.factor_id]||d.factor_id).slice(0,3).join('、')||'暂无';return `<div class="detail"><section class="panel"><h3>${r.name} · 分项因子</h3><p class="panel-sub">各因素按当地合同独立计算；空值没有按 0 处理。</p><div class="factor-list">${factors}</div></section><aside class="panel"><h3>当前解释</h3><p class="panel-sub">分数越高，天气不利潜力越强。</p><div class="facts"><div class="fact"><span>生育阶段</span><b>${r.stage_display}</b></div><div class="fact"><span>主要驱动</span><b>${escapeHtml(drivers)}</b></div><div class="fact"><span>点位覆盖率</span><b>${r.point_coverage===null?'暂无':fmt(r.point_coverage*100,0)+'%'}</b></div><div class="fact"><span>因子权重覆盖率</span><b>${r.factor_weight_coverage===null?'暂无':fmt(r.factor_weight_coverage*100,0)+'%'}</b></div><div class="fact"><span>可信度</span><b>${r.confidence_display}</b></div><div class="fact"><span>来源状态</span><b>${r.source_mode}</b></div><div class="risk-box">${escapeHtml(r.supply_risk_reading)}；该判断未改写 USDA 产量。</div></div>${r.gap_codes.length?`<ul class="gap-list"><li>${r.gap_codes.map(escapeHtml).join('</li><li>')}</li></ul>`:''}</aside></div>`}
    function balanceRow(r){return `<tr><td>${r.name}</td><td>${fmt(r.area_harvested,0)}</td><td>${fmt(r.production,0)}</td><td class="${cls(r.production_change_pct)}">${signed(r.production_change_pct,2,'%')}</td><td>${fmt(r.domestic_use,0)}</td><td class="${cls(r.domestic_use_change_pct)}">${signed(r.domestic_use_change_pct,2,'%')}</td><td>${fmt(r.imports,0)}</td><td>${fmt(r.exports,0)}</td><td>${fmt(r.ending_stocks,0)}</td><td class="${cls(r.ending_stocks_change_pct)}">${signed(r.ending_stocks_change_pct,2,'%')}</td><td>${fmt(r.stocks_to_use,2)}%</td><td class="${cls(r.stocks_to_use_change_pp)}">${signed(r.stocks_to_use_change_pp,2,'pp')}</td></tr>`}
    function render(){const world=DATA.supply[0],r=DATA.regions.find(x=>x.id===selected);document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="28" r="12" fill="white"/><circle cx="42" cy="28" r="12" fill="white"/><circle cx="32" cy="19" r="12" fill="white"/><path d="M20 35c7 12 17 15 24 0-3 16-21 20-24 0Z" fill="#a8e6cf"/></svg></span><div><h1>棉花供需与天气胁迫看板</h1><p>公开版 · 自用基本面框架的透明展示</p></div></div><span class="fresh">数据截止 ${DATA.snapshot_as_of_date}</span></header><section class="hero"><div><span class="eyebrow">全球供需锚点</span><h2>${DATA.conclusion}</h2><p class="hero-note">天气分用于观察当地供给下修风险，不是减产比例。四区采用各自的作物阶段与因子合同，不能直接横向排名或合成伪全球分。</p></div><div class="hero-side"><div class="hero-stat"><span>全球产量变化</span><b class="${cls(world.production_change_pct)}">${signed(world.production_change_pct,2,'%')}</b></div><div class="hero-stat"><span>全球消费变化</span><b>${signed(world.domestic_use_change_pct,2,'%')}</b></div><div class="hero-stat"><span>期末库存变化</span><b class="${cls(world.ending_stocks_change_pct)}">${signed(world.ending_stocks_change_pct,2,'%')}</b></div><div class="hero-stat"><span>库存消费比</span><b class="tight">${fmt(world.stocks_to_use,2)}%</b></div></div></section><section class="section"><div class="section-head"><div><h2>四大棉区天气胁迫</h2><p>点击地区查看分项指标、阶段、覆盖率与数据缺口</p></div><p>0 无明显胁迫 → 100 历史参考范围内极端胁迫</p></div><div class="region-grid">${DATA.regions.map(regionCard).join('')}</div><div id="regionDetail">${detail(r)}</div></section><section class="section"><div class="section-head"><div><h2>官方供需明细</h2><p>${DATA.official_report_month} · USDA FAS · 面积为千公顷，其余数量为千包（480 磅）</p></div><a href="${DATA.official_source.url}" target="_blank" rel="noreferrer">查看官方报告 ↗</a></div><div class="balance"><table><thead><tr><th>地区</th><th>收获面积</th><th>产量</th><th>产量变化</th><th>国内消费</th><th>消费变化</th><th>进口</th><th>出口</th><th>期末库存</th><th>库存变化</th><th>库存消费比</th><th>比率变化</th></tr></thead><tbody>${DATA.supply.map(balanceRow).join('')}</tbody></table></div></section><section class="section method"><article class="panel"><h3>指标怎么读</h3><ul><li>地区总分与分项分数均为 0—100 理论天气胁迫指数。</li><li>红色上升表示不利天气压力增加；绿色下降表示压力缓解。</li><li>“暂无可用值”表示该因子当前阶段不适用、未纳入或证据／数据不足，不代表 0 胁迫。</li></ul></article><article class="panel"><h3>公开展示边界</h3><ul><li>指数尚未校准为减产比例、全国减产数量、概率或因果估计。</li><li>没有生成全球数值天气分，也没有执行天气到供给数量的换算。</li><li>供需表为最新确认官方值；天气代理、物候与管理缺口已在地区详情保留。</li></ul></article></section><footer class="footer">数据来源：USDA Foreign Agricultural Service；天气侧为项目已验收的当地棉区代理序列。页面仅供信息参考，不构成交易建议。</footer>`;document.querySelectorAll('[data-region]').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.region;render();document.getElementById('regionDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}));}
    fetch('./data.json').then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{DATA=d;render()}).catch(e=>{document.getElementById('app').innerHTML=`<div class="error"><h2>数据暂时无法载入</h2><p>请稍后刷新。错误信息：${escapeHtml(e.message)}</p></div>`});
  </script>
</body>
</html>
